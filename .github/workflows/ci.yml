name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = minimum supported; 3.14 = Project-R dev image / CachyOS.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # Unix-socket tests need Linux (ubuntu-latest). No test touches the
      # network: every scraper/downloader HTTP call is mocked.
      - name: Run tests
        run: pytest --tb=short -v --cov=pr_meta --cov-report=term-missing --cov-fail-under=85

  lint:
    name: ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install linters
        run: pip install "ruff==0.17.3" "black==26.10.1"

      - name: ruff check
        run: ruff check .

      - name: black check
        run: black --check .
